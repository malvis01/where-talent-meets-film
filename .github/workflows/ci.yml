name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Package source
        run: zip -r where-talent-meets-film.zip . -x 'node_modules/*' '.next/*' '.git/*'

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: where-talent-meets-film-source
          path: where-talent-meets-film.zip
          retention-days: 7
